name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ctw
          POSTGRES_PASSWORD: ctw
          POSTGRES_DB: ctw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ctw -d ctw"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://ctw:ctw@localhost:5432/ctw
      POSTGIS_IMAGE: postgis/postgis:17-3.5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm migrate
      - name: Generated code matches the spec and the schema
        run: |
          pnpm gen:api
          pnpm gen:db
          git diff --exit-code -- src/http/api-types.ts src/db/schema.ts
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/knightseu/conquer-the-world-server
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; image pushed, deploy skipped. See docs/deploy.md."
            exit 0
          fi
          img=$(jq -rn --arg v "$IMAGE:$GITHUB_SHA" '$v|@uri')
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL&imgURL=$img"
